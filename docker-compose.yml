version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langue_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./backend/db.sqlite3:/app/db.sqlite3
    ports:
      - "8000:8000"
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWOR: password
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsuperuser --noinput || true &&
             python manage.py runserver 0.0.0.0:8000"
  frontend:
    build:
      context: ./mobile-frontend/mobile-app
      dockerfile: Dockerfile
    container_name: langue_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
